name: Yayınla
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"   # her sabah ~05:17/06:17 (Almanya saati) haberleri yenile
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Güncel haberleri ve podcastları topla
        run: python tools/fetch_news.py || true
      - name: Site klasörünü hazırla
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js icons data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
